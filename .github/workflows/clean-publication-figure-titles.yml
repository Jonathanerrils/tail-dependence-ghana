name: Clean publication figure title bands

on:
  push:
    branches:
      - manuscript-publication-revision
    paths:
      - ".github/workflows/clean-publication-figure-titles.yml"
      - "paper/latex/rebuild/clean_figure_titles.py"

permissions:
  contents: write

jobs:
  clean-figure-titles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: manuscript-publication-revision
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet pillow

      - name: Remove obsolete embedded figure titles
        run: python paper/latex/rebuild/clean_figure_titles.py

      - name: Commit cleaned figure assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/latex/rebuild/figures/*.png
          if git diff --cached --quiet; then
            echo "No figure changes to commit."
          else
            git commit -m "Regenerate publication figures without embedded titles"
            git push origin HEAD:manuscript-publication-revision
          fi
