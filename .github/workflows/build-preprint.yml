name: Build preprint package

on:
  push:
    branches:
      - ijfe-submission
    paths:
      - 'paper/latex/preprint/**'
      - '.github/workflows/build-preprint.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile preprint
        uses: xu-cheng/latex-action@v3
        with:
          root_file: manuscript.tex
          working_directory: paper/latex/preprint

      - name: Compile supplementary material
        uses: xu-cheng/latex-action@v3
        with:
          root_file: supplementary.tex
          working_directory: paper/latex/preprint

      - name: Name preprint PDF for upload
        run: |
          cp paper/latex/preprint/manuscript.pdf Jonathan_Nelson_Tail_Dependence_Ghana_Preprint_v1.pdf

      - name: Create preprint source ZIP
        run: |
          cd paper/latex/preprint
          zip -r ../../../preprint-source.zip . \
            -x "*.aux" "*.log" "*.out" "*.bbl" "*.blg" "*.fls" "*.fdb_latexmk" "*.synctex.gz" \
               "manuscript.pdf" "supplementary.pdf"

      - name: Upload preprint package
        uses: actions/upload-artifact@v4
        with:
          name: preprint-package
          path: |
            Jonathan_Nelson_Tail_Dependence_Ghana_Preprint_v1.pdf
            paper/latex/preprint/manuscript.pdf
            paper/latex/preprint/supplementary.pdf
            preprint-source.zip
          if-no-files-found: error
