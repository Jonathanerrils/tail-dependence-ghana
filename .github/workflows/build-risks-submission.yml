name: Build Risks submission package

on:
  push:
    branches:
      - manuscript-publication-revision
    paths:
      - 'paper/latex/risks_submission/**'
      - '.github/workflows/build-risks-submission.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile Risks manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: manuscript.tex
          working_directory: paper/latex/risks_submission

      - name: Compile supplementary material
        uses: xu-cheng/latex-action@v3
        with:
          root_file: supplementary.tex
          working_directory: paper/latex/risks_submission

      - name: Check graphical abstract dimensions
        run: |
          python - <<'PY'
          import struct
          from pathlib import Path
          p = Path("paper/latex/risks_submission/graphical_abstract.png")
          data = p.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("graphical_abstract.png is not a valid PNG")
          width, height = struct.unpack(">II", data[16:24])
          print(f"Graphical abstract: {width} x {height} px")
          if width < 1100 or height < 560:
              raise SystemExit("Graphical abstract is below MDPI minimum 1100 x 560 px")
          PY

      - name: Create journal submission ZIP
        run: |
          cd paper/latex/risks_submission
          zip -r ../../../risks-submission-source.zip . \
            -x "*.aux" "*.log" "*.out" "*.bbl" "*.blg" "*.fls" "*.fdb_latexmk" "*.synctex.gz" "manuscript.pdf" "supplementary.pdf"

      - name: Upload submission package
        uses: actions/upload-artifact@v4
        with:
          name: risks-submission-package
          path: |
            paper/latex/risks_submission/manuscript.pdf
            paper/latex/risks_submission/supplementary.pdf
            risks-submission-source.zip
          if-no-files-found: error
